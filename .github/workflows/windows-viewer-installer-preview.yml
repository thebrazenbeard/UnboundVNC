name: Windows viewer preview-only install/uninstall transaction

on:
  pull_request:
    paths:
      - 'packaging/viewer-windows/installer-preview/**'
      - '.github/workflows/windows-viewer-installer-preview.yml'

permissions:
  contents: read

jobs:
  windows-viewer-preview-transaction:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24 source/build prerequisite
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact production renderer and install pinned Electron packager
        shell: pwsh
        run: |
          npm ci --prefix apps/viewer --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Viewer npm ci failed.' }
          npm run build --prefix apps/viewer
          if ($LASTEXITCODE -ne 0) { throw 'Renderer production build failed.' }
          npm ci --prefix packaging/viewer-windows --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Desktop npm ci failed.' }
          node --test packaging/viewer-windows/tests/local-server.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Loopback policy tests failed.' }
      - name: Build unsigned folder only in runner temp — no installer/artifact
        shell: pwsh
        run: |
          node packaging/viewer-windows/scripts/prepare.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop prepare failed.' }
          $out = Join-Path $env:RUNNER_TEMP 'unboundvnc-viewer-desktop-check'
          & './packaging/viewer-windows/node_modules/.bin/electron-packager.cmd' packaging/viewer-windows UnboundVNCViewer --platform=win32 --arch=x64 --out=$out --asar
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned app folder build failed.' }
      - name: Preview, staged apply, real Electron framebuffer, guarded rollback and preview uninstall
        shell: pwsh
        run: ./packaging/viewer-windows/installer-preview/Invoke-HostedPreviewAcceptance.ps1

      # No upload-artifact: neither binary nor remote framebuffer/profile is distributable.
