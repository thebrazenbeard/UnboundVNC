name: Strict RFB Extensions Chromium

on:
  pull_request:
    paths:
      - 'apps/viewer/e2e/strict-rfb-extensions.mjs'
      - 'tests/interop/rfb-fixture.mjs'
      - '.github/workflows/viewer-strict-rfb-extensions.yml'
  workflow_dispatch:

jobs:
  strict-rfb-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json
      - name: Install pinned viewer dependencies
        run: npm ci --prefix apps/viewer
      - name: Install independent Chromium test harness
        working-directory: apps/viewer
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Assert negotiated DesktopSize, Raw, Hextile, Tight and input after resize
        working-directory: apps/viewer
        run: node e2e/strict-rfb-extensions.mjs
