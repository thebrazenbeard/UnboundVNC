name: Tailnet tsnet source-only admission

on:
  pull_request:
    paths:
      - "experiments/tailnet-admission-go/**"
      - ".github/workflows/tailnet-tsnet-admission-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sdk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false
      - name: Compile real tsnet SDK API and run fail-closed unit tests
        working-directory: experiments/tailnet-admission-go
        run: go test -mod=mod -count=1 -v ./...
      - name: Emit public module checksum manifest for reviewable pinning
        working-directory: experiments/tailnet-admission-go
        run: |
          printf 'GO_SUM_BASE64='
          base64 -w0 go.sum
          printf '\n'
